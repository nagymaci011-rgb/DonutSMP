sidebar-footer: "&7play.example.com"

economy:
  starting-balance: 1000

teleport:
  delay-seconds: 3        # standing-still countdown for /rtp, /spawn, /tpa (staff skip it)

rtp:
  world: world
  min-radius: 250
  max-radius: 5000
  cooldown-seconds: 30

auction:
  max-listings: 5
  max-price: 1000000000000
  duration-hours: 48
  tax-percent: 0

combat:
  seconds: 20
  allowed-commands: [msg, tell, w, r, reply, whisper]

